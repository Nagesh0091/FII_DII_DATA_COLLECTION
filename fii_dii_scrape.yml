name: FII DII Daily Scrape

on:
  schedule:
    # Cron is in UTC. 13:30 UTC = 7:00 PM IST.
    # Runs Mon-Fri only (5paisa has no new data on weekends anyway,
    # but this avoids a wasted run).
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the workflow can commit the updated CSV back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python fii_dii_scraper.py

      - name: Commit and push if data changed
        run: |
          git config user.name "fii-dii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fii_dii_cash_history.csv scraper.log
          if git diff --cached --quiet; then
            echo "No new data - nothing to commit."
          else
            git commit -m "Daily FII/DII data update: $(date -u +'%Y-%m-%d')"
            git push
          fi
